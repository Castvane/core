name: Verify candidate artifacts
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful Candidate artifacts workflow run ID on main
        type: string
        required: true

permissions:
  actions: read
  contents: read
  attestations: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'Castvane/core'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.candidate_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify both binary and container archives
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          metadata=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,conclusion,headBranch,headSha)
          jq -e '.workflowName == "Candidate artifacts" and .conclusion == "success" and .headBranch == "main"' <<< "$metadata"
          revision=$(jq -er .headSha <<< "$metadata")
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir candidates
          version=$(jq -er .version candidates/castvane-core-linux-amd64/native-build.json)
          bash scripts/verify-candidate-artifacts.sh candidates "$GITHUB_REPOSITORY" "$revision" "$version"
