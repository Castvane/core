[package]
name = "restreamer-core"
version = "0.2.0-rc.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
tempfile = "3"
subtle = "2"
bytes = "1"
cap-std = "4"
futures-util = "0.3"
httpdate = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
object_store = { version = "0.14", default-features = false, features = ["aws"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
base64 = "0.22"
url = "2"
percent-encoding = "2"
tokio-util = { version = "0.7", features = ["io", "rt"] }
async-stream = "0.3"
jiff = "1"
croner = { version = "5", default-features = false, features = ["std", "jiff"] }
glob = "0.3"
regex = "1"
getrandom = "0.4"
ipnet = { version = "2", features = ["serde"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

tower = { version = "0.5", features = ["util"] }
instant-acme = { version = "0.8.5", features = ["rcgen"] }
x509-parser = "0.18"
openraft = { version = "0.9.22", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.11"
async-graphql = { version = "7.2", default-features = false, features = ["dynamic-schema"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "feature", "fs"] }

[target.'cfg(windows)'.dependencies]
win32job = "2.1"
sysinfo = { version = "0.40.4", default-features = false, features = ["disk", "network", "system"] }
