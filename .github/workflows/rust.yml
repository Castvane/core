name: Rust
on:
  push:
  pull_request:
  schedule:
    - cron: '13 4 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg openssl
      - run: rustup show active-toolchain && cargo --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Verify kernel CPU and memory enforcement in a disposable cgroup
        run: bash scripts/ci-test-cgroup.sh
      - run: bash scripts/test-media-services.sh
      - run: bash scripts/test-minio.sh
      - run: cargo build --locked --release
      - run: bash scripts/test-acme.sh target/release/restreamer-core
      - run: bash scripts/smoke-test.sh target/release/restreamer-core
      - run: python3 scripts/test-cluster.py target/release/restreamer-core
      - name: Exercise recovery under concurrent media and API load
        env:
          SOAK_SECONDS: ${{ github.event_name == 'schedule' && '120' || '5' }}
        run: python3 scripts/test-recovery.py target/release/restreamer-core --seconds "$SOAK_SECONDS"

  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native FFmpeg and locate OpenSSL
        shell: pwsh
        run: ./scripts/install-ffmpeg-windows.ps1
      - name: Check toolchain and media tools
        shell: pwsh
        run: |
          rustup show active-toolchain
          ffmpeg -version
          ffprobe -version
          openssl version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features --no-fail-fast
      - name: Install the checksum-pinned native MediaMTX fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = "v1.21.4"
          $asset = "mediamtx_${release}_windows_amd64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $fixture = Join-Path $env:RUNNER_TEMP "castvane-mediamtx"
          Invoke-WebRequest -Uri "https://github.com/bluenviron/mediamtx/releases/download/$release/$asset" -OutFile $archive
          $digest = "835645b2700ffce4d2b6cb04bfa0aadce95335da6dfc0d7c2114e6da585734f8"
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash -ne $digest) {
            throw "MediaMTX fixture checksum mismatch"
          }
          Expand-Archive -Path $archive -DestinationPath $fixture
          $binary = Join-Path $fixture "mediamtx.exe"
          Add-Content $env:GITHUB_ENV "PHASE3_MEDIAMTX_BINARY=$binary"
      - name: Exercise RTMP, RTMPS, HTTP-FLV and clear SRT on Windows
        run: cargo test --locked --test media rtmp_rtmps_srt_ingest_playback_disconnect_and_flv -- --ignored --nocapture
      - name: Track encrypted SRT compatibility with the Windows FFmpeg build
        id: encrypted-srt
        continue-on-error: true
        run: cargo test --locked --test media encrypted_srt_ingest_playback_disconnect -- --ignored --nocapture
      - name: Report an encrypted SRT interoperability failure
        if: steps.encrypted-srt.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Output '::warning::Encrypted SRT playback failed. See docs/WINDOWS.md for the tracked compatibility limitation.'
          Add-Content $env:GITHUB_STEP_SUMMARY 'Encrypted SRT playback remains a known compatibility gap for the Windows FFmpeg and MediaMTX pairing. The encrypted fixture ran and failed.'
      - run: cargo build --locked --release
      - run: python scripts/smoke-test-windows.py target/release/restreamer-core.exe
      - name: Package portable Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/windows | Out-Null
          Copy-Item target/release/restreamer-core.exe,LICENSE,README.md,docs/WINDOWS.md dist/windows
          Compress-Archive -Path dist/windows/* -DestinationPath dist/castvane-core-windows-amd64.zip
          $archive = Get-Item dist/castvane-core-windows-amd64.zip
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Set-Content "$($archive.FullName).sha256" "$hash  $($archive.Name)" -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: castvane-core-windows-amd64
          path: dist/castvane-core-windows-amd64.zip*
          if-no-files-found: error
