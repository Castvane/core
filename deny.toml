[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2026-0542", reason = "Unmaintained transitively via stable OpenRaft. Review at the next consensus-library upgrade." },
    { id = "RUSTSEC-2026-0543", reason = "Unmaintained transitively via OpenRaft and dependencies. Review before the first stable release." },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "BSL-1.0", "CC0-1.0", "ISC", "MIT", "MIT-0",
    "Unicode-3.0", "Unlicense", "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
