name: Promote release candidate
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful Candidate artifacts workflow run ID on main
        type: string
        required: true
      version:
        description: Exact candidate version without the v prefix
        type: string
        required: true
      publish_ghcr:
        description: Push the Core-only multi-architecture manifest to GHCR
        type: boolean
        default: false
      publish_dockerhub:
        description: Push the Core-only multi-architecture manifest to the configured Docker Hub repository
        type: boolean
        default: false

concurrency:
  group: castvane-candidate-promotion
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  attestations: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'Castvane/core'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-candidate
    permissions:
      actions: read
      contents: write
      attestations: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.candidate_run }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify successful run and release artifacts
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          build=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,conclusion,headSha,headBranch)
          jq -e '.workflowName == "Candidate artifacts" and .conclusion == "success" and .headBranch == "main"' <<< "$build"
          revision=$(jq -er '.headSha | select(test("^[a-f0-9]{40}$"))' <<< "$build")
          gh run list --repo "$GITHUB_REPOSITORY" --commit "$revision" --workflow rust.yml --status success \
            --json databaseId --jq 'length > 0' | grep -qx true
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir candidates
          bash scripts/verify-candidate-artifacts.sh candidates "$GITHUB_REPOSITORY" "$revision" "$VERSION"
          mkdir release
          for arch in amd64 arm64; do
            directory="candidates/castvane-core-linux-$arch"
            native="castvane-core-$VERSION-linux-$arch.tar.gz"
            cp "$directory/$native" "$directory/$native.sha256" release/
            cp "$directory/core.bom.cdx.json" "release/core-linux-$arch.bom.cdx.json"
            cp "$directory/native-build.json" "release/native-linux-$arch.json"
            cp "$directory/container.bom.cdx.json" "release/container-$arch.bom.cdx.json"
          done
          directory="candidates/castvane-core-windows-amd64"
          native="castvane-core-$VERSION-windows-amd64.zip"
          cp "$directory/$native" "$directory/$native.sha256" release/
          cp "$directory/core.bom.cdx.json" release/core-windows-amd64.bom.cdx.json
          cp "$directory/native-build.json" release/native-windows-amd64.json
          echo "CASTVANE_RELEASE_REVISION=$revision" >> "$GITHUB_ENV"
      - name: Assemble the exact-version GHCR manifest
        if: inputs.publish_ghcr
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          bash scripts/publish-candidate-image.sh "$image" "$VERSION" "$CASTVANE_RELEASE_REVISION" > release/ghcr-manifest.txt
      - name: Assemble the exact-version Docker Hub manifest
        if: inputs.publish_dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$DOCKERHUB_REPOSITORY" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9_-]*$ ]]
          [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          bash scripts/publish-candidate-image.sh "docker.io/$DOCKERHUB_REPOSITORY" "$VERSION" "$CASTVANE_RELEASE_REVISION" > release/dockerhub-manifest.txt
      - name: Prepare an unpublished prerelease draft
        run: |
          set -euo pipefail
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$CASTVANE_RELEASE_REVISION" \
            --title "Castvane Core $VERSION" --draft --prerelease --generate-notes release/*
