name: Dependency policy
on:
  push:
    paths: ['Cargo.*', 'deny.toml', 'rust-toolchain.toml', '.github/workflows/dependencies.yml']
  pull_request:
    paths: ['Cargo.*', 'deny.toml', 'rust-toolchain.toml', '.github/workflows/dependencies.yml']
  schedule:
    - cron: '27 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned cargo-deny
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/cargo-deny"
          mkdir -p "$destination"
          archive=cargo-deny-0.22.1-x86_64-unknown-linux-musl.tar.gz
          curl --fail --location --silent --show-error \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.1/$archive" \
            --output "$destination/$archive"
          ( cd "$destination"; printf '%s  %s\n' 13f7e825e9cb811c2f8de63f29b0f45851dfb53004029f0f2501af524728364d "$archive" | sha256sum -c - )
          tar -xf "$destination/$archive" -C "$destination" --strip-components=1
          echo "$destination" >> "$GITHUB_PATH"
      - run: cargo deny --locked check
