name: Candidate artifacts
on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo build --locked --release
      - run: bash scripts/smoke-test.sh target/release/restreamer-core
      - run: python3 scripts/package-release.py target/release/restreamer-core dist
      - name: Build and exercise the container
        run: bash scripts/test-container.sh target/release/restreamer-core dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: castvane-core-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
