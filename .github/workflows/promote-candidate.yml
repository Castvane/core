name: Promote release candidate
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful Candidate artifacts workflow run ID on main
        type: string
        required: true
      version:
        description: Exact candidate version without the v prefix
        type: string
        required: true
      publish_ghcr:
        description: Push the Core-only multi-architecture manifest to GHCR
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  attestations: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'Castvane/core'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-candidate
    permissions:
      actions: read
      contents: write
      attestations: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.candidate_run }}
      VERSION: ${{ inputs.version }}
      PUBLISH: ${{ inputs.publish_ghcr }}
    steps:
      - name: Verify successful run and release artifacts
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          build=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,conclusion,headSha,headBranch)
          jq -e '.workflowName == "Candidate artifacts" and .conclusion == "success" and .headBranch == "main"' <<< "$build"
          revision=$(jq -er '.headSha | select(test("^[a-f0-9]{40}$"))' <<< "$build")
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir candidates
          mkdir release
          for arch in amd64 arm64; do
            directory="candidates/castvane-core-linux-$arch"
            native="castvane-core-$VERSION-linux-$arch.tar.gz"
            container=castvane-core-container.tar.gz
            (
              cd "$directory"
              jq -e --arg version "$VERSION" --arg revision "$revision" '.version == $version and .commit == $revision' native-build.json
              sha256sum -c "$native.sha256" "$container.sha256"
              gh attestation verify "$native" --repo "$GITHUB_REPOSITORY" --source-digest "$revision" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/candidates.yml"
              gh attestation verify "$container" --repo "$GITHUB_REPOSITORY" --source-digest "$revision" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/candidates.yml"
            )
            cp "$directory/$native" "$directory/$native.sha256" release/
            cp "$directory/core.bom.cdx.json" "release/core-$arch.bom.cdx.json"
            cp "$directory/native-build.json" "release/native-$arch.json"
          done
          echo "CASTVANE_RELEASE_REVISION=$revision" >> "$GITHUB_ENV"
      - name: Assemble the exact-version GHCR manifest
        if: inputs.publish_ghcr
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          # Existing tags require a new candidate version. Staging references are scoped to this run.
          if docker buildx imagetools inspect "$image:$VERSION" > /dev/null 2>&1; then
            echo "The requested version already exists in GHCR" >&2
            exit 1
          fi
          sources=()
          for arch in amd64 arm64; do
            directory="candidates/castvane-core-linux-$arch"
            local_id=$(jq -er '.[0].Id' "$directory/container-image.json")
            docker load --input "$directory/castvane-core-container.tar.gz"
            [[ $(docker image inspect --format '{{.Architecture}}' "$local_id") == "$arch" ]]
            [[ $(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$local_id") == "$CASTVANE_RELEASE_REVISION" ]]
            [[ $(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$local_id") == "$VERSION" ]]
            staging="$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            docker tag "$local_id" "$staging"
            docker push "$staging"
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$staging")
            [[ "$digest" == "$image@sha256:"* ]]
            sources+=("$digest")
          done
          docker buildx imagetools create --tag "$image:$VERSION" "${sources[@]}"
          docker buildx imagetools inspect "$image:$VERSION" > release/container-manifest.txt
      - name: Prepare an unpublished prerelease draft
        run: |
          set -euo pipefail
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$CASTVANE_RELEASE_REVISION" \
            --title "Castvane Core $VERSION" --draft --prerelease --generate-notes release/*
