name: Rust
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg openssl
      - run: rustup show active-toolchain && cargo --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - name: Verify kernel CPU and memory enforcement in a disposable cgroup
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --unit="castvane-cgroup-fixture-${GITHUB_RUN_ID}" \
            --uid="$(id -u)" --property="Delegate=cpu memory" --property=DelegateSubgroup=fixture-runner             --working-directory="$PWD" --setenv="PATH=$PATH" --setenv="HOME=$HOME" \
            --setenv="CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" --setenv="RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
            bash -euc '
              current=$(sed -n "s/^0:://p" /proc/self/cgroup)
              [[ "$current" == */fixture-runner ]]
              root="/sys/fs/cgroup${current%/fixture-runner}"
              echo "+cpu +memory" > "$root/cgroup.subtree_control"
              bash scripts/test-cgroup.sh "$root"
            '
      - run: bash scripts/test-media-services.sh
      - run: bash scripts/test-minio.sh
      - run: cargo build --locked --release
      - run: bash scripts/test-acme.sh target/release/restreamer-core
      - run: bash scripts/smoke-test.sh target/release/restreamer-core
      - run: python3 scripts/test-recovery.py target/release/restreamer-core --seconds 5
